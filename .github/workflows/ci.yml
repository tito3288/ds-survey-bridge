name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-local-anon-key
  SUPABASE_SERVICE_ROLE_KEY: fake-local-service-role-key
  TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
  TWILIO_AUTH_TOKEN: fake-local-auth-token
  TWILIO_PHONE_NUMBER: "+15555550100"
  SURVEY_SMS_DELAY_MINUTES: "0"
  DELIVERY_WORKER_ENABLED: "false"
  RESEND_API_KEY: re_fake_local_key
  SUPPORT_EMAIL: support@example.test

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

  database:
    name: Local database checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Run database tests
        run: npm run test:db

      - name: Verify generated database types
        run: npm run db:types:check

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
